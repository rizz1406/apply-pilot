<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1410">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A personal, cloud-hosted job-search command center — now with glass UI and dark mode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=54">
  <title>ApplyPilot — Command Center</title>
  <script>try{const t=localStorage.getItem("applypilot-theme"); if(t) document.documentElement.setAttribute("data-theme",t); else if(window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme","dark"); }catch{}</script>
</head>
<body>
  <div class="offline-banner" id="offline-banner" hidden>Offline mode: showing your last synced data.</div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="ApplyPilot home">
        <span class="brand-mark">A</span>
        <span>ApplyPilot <small>command center</small></span>
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-profile">
        <span class="avatar">RB</span>
        <span><strong>Rizwan Baig</strong><small>Data Analyst · Hyderabad</small></span>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="date-label"></p>
          <h1 id="page-title">Today</h1>
        </div>
        <div class="top-actions">
          <span class="agent-status" title="Live sources are checked every 10 minutes"><i></i><span>10-min scan active</span></span>
          <button class="secondary-button scan-toggle" id="scan-toggle" type="button">Pause scans</button>
          <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
          <button class="icon-button" id="notifications-button" title="Notifications" aria-label="Notifications">
            <span class="bell-icon" aria-hidden="true"></span><span class="notification-dot"></span>
          </button>
          <button class="primary-button" id="demo-action">Run job scan</button>
        </div>
      </header>

      <div id="app" class="page-content" aria-live="polite"></div>
    </main>

    <nav class="mobile-nav" aria-label="Primary navigation"></nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="assertive"></div>
  <div class="operation-overlay" id="operation-overlay" hidden>
    <div class="operation-card" role="status" aria-live="polite">
      <span class="operation-spinner" aria-hidden="true"></span>
      <div><strong id="operation-title">Preparing application</strong><p id="operation-detail">Building your ATS resume pack from the verified profile.</p></div>
    </div>
  </div>
  <dialog id="detail-dialog"></dialog>
  <script src="vendor/jspdf.umd.min.js?v=1"></script>
  <script src="app.js?v=54"></script>
</body>
</html>
