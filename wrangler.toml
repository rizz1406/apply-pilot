name = "applypilot-api"
main = "worker/index.js"
compatibility_date = "2026-08-01"
preview_urls = false

[ai]
binding = "AI"
remote = true

[vars]
APP_ORIGIN = "https://applypilot.pages.dev"
GEMINI_MODEL = "gemini-1.5-flash"
GEMINI_FAST_MODEL = "gemini-1.5-flash"
DEMO_MODE = "false"

[[d1_databases]]
binding = "DB"
database_name = "applypilot"
database_id = "5d5145ea-980e-48d1-9299-2b38a43cde3f"
migrations_dir = "migrations"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "applypilot-tasks"

[[queues.consumers]]
queue = "applypilot-tasks"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "applypilot-tasks-dlq"

[triggers]
crons = ["*/5 * * * *", "15 13 * * 1-5"]
