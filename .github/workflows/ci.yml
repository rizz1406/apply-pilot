name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Check formatting (if configured)
        run: npm run lint --if-present
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir dist || echo "wrangler dry-run skipped"
        env:
          CLOUDFLARE_API_TOKEN: dummy
